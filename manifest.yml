# Eight-D: 8D / CAPA problem solving for Jira (Codegeist 2026 entry, THATCHED Ltd)
# Assistive only: a human approves every D-step. No outbound network access.
modules:
  jira:issuePanel:
    - key: eightd-issue-panel
      resource: main
      resolver:
        function: resolver
      title: 8D
      icon: resource:main;icons/logo-tile.svg
  jira:globalPage:
    - key: eightd-overview
      resource: main
      resolver:
        function: resolver
      title: 8D Overview
      icon: resource:main;icons/logo-tile.svg
  rovo:agent:
    - key: eightd-coach
      name: 8D Coach
      icon: resource:main;icons/logo-tile.svg
      description: Guides a quality team through the eight disciplines (D1-D8) of an
        8D problem-solving report on a Jira work item.
      prompt: >
        You are 8D Coach, an assistant for industrial quality teams working an
        8D (eight disciplines) problem-solving report on a Jira work item. You
        are assistive only: you draft, a human decides. Never mark a D-step
        approved; tell the user to press Approve in the 8D panel after review.

        Steps: D1 team (roles, not named performance), D2 problem description
        (5W2H: what, where, when, who-detects, why-it-matters, how, how-many),
        D3 containment, D4 root cause (5 Whys, fishbone), D5 permanent
        corrective actions, D6 implement and validate, D7 prevent recurrence, D8
        close and recognise the team.

        For D2, call draftProblemStatement and show all seven 5W2H lines as
        returned. If its "missingNames" list is not empty, ask for exactly
        those fields in one short list ("Please add: ..."); never guess them.
        Always end a D2 draft with the "approval" sentence from the result.

        Rules: use only facts from the work item and the actions' results;
        never invent values, part numbers, lots, dates or measurements. Never score, rank or blame individual workers or
        operators; talk about processes, machines, parts and lots. No medical,
        legal or financial advice. If the work item has the label "safety",
        reply first: "Safety-related: notify your quality manager", and do not
        draft any step.
      conversationStarters:
        - Draft the D2 problem statement for this work item
        - Which 8Ds are still open?
        - Find similar past nonconformances for this work item
        - Scaffold a 5-Why chain from similar past root causes
      actions:
        - draftProblemStatement
        - listOpen8Ds
        - findSimilarNonconformances
        - scaffoldFiveWhy
        - createCorrectiveActions
        - generateReport
  action:
    - key: draftProblemStatement
      name: Draft 8D problem statement (5W2H)
      function: draftProblemStatementFn
      actionVerb: GET
      description: Reads a Jira work item and returns a 5W2H draft of the D2 problem
        statement for a human to review and approve.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item key, for example QA-12.
    - key: listOpen8Ds
      name: List open 8Ds
      function: listOpen8DsFn
      actionVerb: GET
      description: Lists the 8D reports stored by Eight-D that are not yet closed (D8
        not approved), with progress.
    # The four actions below are read-only previews (actionVerb GET, PITFALLS 14). Creating work
    # items or publishing the report happens only when a human presses the button in the 8D panel.
    - key: findSimilarNonconformances
      name: Find similar nonconformances
      function: similarFn
      actionVerb: GET
      description: Finds up to 3 past work items with the same part family or labels,
        with their approved root causes and citations (Jira links and Confluence
        root-cause pages the user can see).
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item key, for example QA-12.
    - key: scaffoldFiveWhy
      name: Scaffold a 5-Why chain
      function: fiveWhyFn
      actionVerb: GET
      description: Returns a draft 5-Why chain whose candidate answers come from
        similar past root causes. A human picks each answer and approves D4 in
        the 8D panel.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item key, for example QA-12.
    - key: createCorrectiveActions
      name: Preview corrective actions
      function: correctiveActionsFn
      actionVerb: GET
      description: Lists the corrective action work items (summary, owner, due date)
        that would be created from the approved D5 and D6 text. Creation needs a
        human click in the 8D panel.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item key, for example QA-12.
    - key: generateReport
      name: Preview customer 8D report
      function: reportFn
      actionVerb: GET
      description: Shows which approved D-steps would go into the customer 8D report
        page in Confluence. Publishing needs a human click at D8 in the 8D
        panel.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item key, for example QA-12.
  rovo:mcp:
    - key: eightd-mcp
      name: Eight-D MCP
      tools:
        - listOpen8Ds
        - draftProblemStatement
        - findSimilarNonconformances
        - scaffoldFiveWhy
        - createCorrectiveActions
        - generateReport
  graph:connector:
    - key: eightd-quality-objects
      name: Eight-D quality objects
      icons:
        light: resource:main;icons/logo-tile.svg
        dark: resource:main;icons/logo-tile.svg
      # Part, machine and supplier-lot records are pushed as documents with a
      # "kind" property: the connector schema only accepts atlassian:* types.
      objectTypes:
        - atlassian:document
      capabilities:
        replicatesPermissions: false
        syncFidelity: append
        supportsIncrementalSync: false
      datasource:
        onConnectionChange:
          function: onConnectionChangeFn
  jira:entityProperty:
    - key: eightd-mirror
      entityType: issue
      propertyKey: eightd
      values:
        - path: v
          type: number
        - path: open
          type: string
  function:
    - key: resolver
      handler: index.handler
    - key: draftProblemStatementFn
      handler: index.draftProblemStatement
    - key: listOpen8DsFn
      handler: index.listOpen8Ds
    - key: similarFn
      handler: index.findSimilarNonconformances
    - key: fiveWhyFn
      handler: index.scaffoldFiveWhyAction
    - key: correctiveActionsFn
      handler: index.createCorrectiveActionsAction
    - key: reportFn
      handler: index.generateReportAction
    - key: onConnectionChangeFn
      handler: index.onConnectionChange
resources:
  - key: main
    path: static/eightd-ui/build
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - search:confluence
    - read:space:confluence
    - read:page:confluence
    - write:page:confluence
    # Root-cause page labels go through REST v1 POST /wiki/rest/api/content/{id}/label (v2 has no label create).
    - read:label:confluence
    - write:label:confluence
    - storage:app
    - write:object:jira
    - read:object:jira
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/f753cecd-d0ad-48d6-a7a0-58834ff31188
